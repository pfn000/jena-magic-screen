; everything on Jena's box, restarted if it crashes (same pieces as the systemd units in box/systemd)
[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1600x704x24 -nolisten tcp
priority=10
[program:openbox]
command=/usr/bin/openbox
user=jena
environment=DISPLAY=":99",HOME="/home/jena"
priority=20
[program:tint2]
command=/usr/bin/tint2
user=jena
environment=DISPLAY=":99",HOME="/home/jena"
priority=30
[program:vnc]
command=/usr/bin/x11vnc -display :99 -forever -shared -viewonly -nopw -localhost -rfbport 5900 -noxdamage -quiet
priority=30
[program:novnc]
command=/usr/bin/websockify --web /usr/share/novnc 0.0.0.0:6080 localhost:5900
priority=40
[program:vnc-mama]
command=/usr/bin/x11vnc -display :99 -forever -shared -nopw -localhost -rfbport 5901 -noxdamage -quiet
priority=30
[program:novnc-mama]
command=/usr/bin/websockify 127.0.0.1:6082 localhost:5901
priority=40
[program:llm-chat]
command=/bin/bash /opt/jena-repo/box/start-jenaxi-chat.sh
priority=50
[program:llm-jx0]
command=/bin/sh -c 'test -f /models/JenaXI.gguf || { echo "no /models/JenaXI.gguf mounted"; sleep 3600; exit 1; }; exec /opt/llama/llama-server -m /models/JenaXI.gguf --alias JenaXI-0 --host 127.0.0.1 --port 8089 -c 1024'
priority=50
[program:tts]
command=/opt/voice/bin/python /opt/voice/tts_server.py
directory=/opt/voice
environment=JENA_VOICE="hfc_female"
priority=50
[program:gateway]
command=/usr/bin/node /opt/jena-repo/box/jena-gateway.mjs
environment=PORT="8088"
priority=60
[program:desk]
command=/usr/bin/python3 -u /home/jena/.jena_desk.py
user=jena
directory=/home/jena
environment=DISPLAY=":99",DISP=":99",HOME="/home/jena",JENA_BOX_PORT="6081"
priority=70
