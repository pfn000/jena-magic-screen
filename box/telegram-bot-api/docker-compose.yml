services:
  telegram-bot-api:
    build:
      context: ../..
      dockerfile: box/telegram-bot-api/Dockerfile
    image: jena-telegram-bot-api:local
    container_name: jena-telegram-bot-api
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?Set TELEGRAM_API_ID in the env file}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?Set TELEGRAM_API_HASH in the env file}
    volumes:
      - jena-telegram-bot-api-data:/data
    expose:
      - "8081"
    networks:
      jena-private:
        aliases:
          - telegram-bot-api
    healthcheck:
      test: ["CMD", "bash", "-lc", "bash -c '</dev/tcp/127.0.0.1/8081'"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  jena-telegram-bot-api-data:

networks:
  jena-private:
    external: true
