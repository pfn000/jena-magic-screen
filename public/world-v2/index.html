<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/world-v2/">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jena's Room · world v2 preview</title>
<style>
  html,body{margin:0;height:100%;background:#07060d;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;color:#efeaff}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #bar{position:fixed;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 24px);left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:6px;padding:6px;
       border-radius:24px;background:rgba(30,24,52,.42);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);
       border:1px solid rgba(255,255,255,.16);box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.18)}
  #bar button{all:unset;cursor:pointer;padding:9px 16px;border-radius:18px;font-size:14px;font-weight:600;letter-spacing:.2px;color:#e9e3ff}
  #bar button.on{background:rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
  #load{position:fixed;inset:0;display:grid;place-items:center;font-size:14px;color:#bdb3e6;pointer-events:none;transition:opacity .6s}
  #load.done{opacity:0}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
            "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="load">loading Jena's room…</div>
<div id="bar">
  <button data-cam="wide">Room</button><button data-cam="desk">Desk</button><button data-cam="bed">Bed</button><button data-cam="window">Window</button><button data-cam="chair">Sit in chair</button><button id="look">☀︎ Day</button>
</div>
<script type="module" src="./viewer.js"></script>
</body>
</html>
